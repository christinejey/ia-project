name: Terraform Plan

on:
  workflow_dispatch:

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Write backend config
        run: |
          cat > terraform/backend.hcl <<EOF
          endpoints                  = { s3 = "${ENDPOINT}" }
          access_key                 = "${KEY_ID}"
          secret_key                 = "${SECRET}"
          skip_requesting_account_id = true
          use_path_style             = true
          EOF
        env:
          ENDPOINT: ${{ secrets.TF_BACKEND_ENDPOINT }}
          KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend-config=backend.hcl
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Terraform Plan
        id: plan
        working-directory: terraform
        continue-on-error: true  # exit code 2 (changes present) must not fail the step
        run: terraform plan -out=tfplan -input=false -detailed-exitcode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # exit code 0 = no changes, 1 = error, 2 = changes present

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

      - name: Show Plan Summary
        if: steps.plan.outputs.exitcode == '2'
        working-directory: terraform
        run: terraform show -no-color tfplan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload Plan Artifact
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: terraform/tfplan
          retention-days: 5
