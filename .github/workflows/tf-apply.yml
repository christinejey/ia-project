name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production

jobs:
  # Plan runs first so reviewers can see exactly what will change
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Write backend config
        run: |
          cat > terraform/backend.hcl <<EOF
          endpoints                  = { s3 = "${ENDPOINT}" }
          access_key                 = "${KEY_ID}"
          secret_key                 = "${SECRET}"
          skip_requesting_account_id = true
          use_path_style             = true
          EOF
        env:
          ENDPOINT: ${{ secrets.TF_BACKEND_ENDPOINT }}
          KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend-config=backend.hcl
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Terraform Plan
        id: plan
        working-directory: terraform
        continue-on-error: true
        run: terraform plan -out=tfplan -input=false -detailed-exitcode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

      - name: Show Plan
        working-directory: terraform
        run: terraform show -no-color tfplan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-apply-${{ github.run_id }}
          path: terraform/tfplan
          retention-days: 1

  # Apply waits for manual approval via GitHub Environment protection rules.
  # Configure "production" environment in repo Settings → Environments → Required reviewers.
  apply:
    name: Apply
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    if: needs.plan.outputs.exitcode == '2'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Write backend config
        run: |
          cat > terraform/backend.hcl <<EOF
          endpoints                  = { s3 = "${ENDPOINT}" }
          access_key                 = "${KEY_ID}"
          secret_key                 = "${SECRET}"
          skip_requesting_account_id = true
          use_path_style             = true
          EOF
        env:
          ENDPOINT: ${{ secrets.TF_BACKEND_ENDPOINT }}
          KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend-config=backend.hcl
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-apply-${{ github.run_id }}
          path: terraform/

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false tfplan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Show Outputs
        working-directory: terraform
        run: terraform output
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
