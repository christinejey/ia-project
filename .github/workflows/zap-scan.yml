name: OWASP ZAP Security Scan

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Cloudflare Workers"]
    types:
      - completed
    branches:
      - main

permissions: read-all

jobs:
  zap-webchat:
    name: ZAP Scan — webchat
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Baseline scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/.zap:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t https://webchat-worker.christina-api.workers.dev \
              -c /zap/wrk/rules.tsv

  zap-admin:
    name: ZAP Scan — admin
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Baseline scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/.zap:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t https://admin-worker.christina-api.workers.dev \
              -c /zap/wrk/rules.tsv
