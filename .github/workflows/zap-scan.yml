name: OWASP ZAP Security Scan

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Cloudflare Workers"]
    types:
      - completed
    branches:
      - main

permissions: read-all

jobs:
  zap-webchat:
    name: ZAP Scan — webchat
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: https://webchat-worker.christina-api.workers.dev
          rules_file_name: .zap/rules.tsv
          artifact_name: zap_scan_webchat
          fail_action: true
          allow_issue_writing: false

  zap-admin:
    name: ZAP Scan — admin
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: https://admin-worker.christina-api.workers.dev
          rules_file_name: .zap/rules.tsv
          artifact_name: zap_scan_admin
          fail_action: true
          allow_issue_writing: false
